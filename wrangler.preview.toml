name = "ppi-ishikawa-preview"
main = "./cloudflare/preview-worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "preview.ppi-ishikawa.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true
