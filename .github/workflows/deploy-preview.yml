name: Deploy private preview to Cloudflare

on:
  pull_request:
    branches: [main]
    paths:
      - 'astro.config.mjs'
      - 'src/**'
      - 'public/**'
      - 'cloudflare/**'
      - 'wrangler.preview.toml'
      - 'scripts/check-internal-links.mjs'
      - 'scripts/apply-feature-gates.mjs'
      - 'scripts/check-feature-*.mjs'
      - '.github/workflows/deploy-preview.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppi-ishikawa-private-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: private-preview
    env:
      PPI_PREVIEW_SITE_URL: https://preview.ppi-ishikawa.org
      PUBLIC_PREVIEW_DEMO_MODE: 'true'
      CLOUDFLARE_ACCOUNT_ID: '316057e5db63a08ff4ed5b0be7f4f24e'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate and build complete preview (production Supabase disabled)
        run: |
          npm run check:theme
          npm run check:ui
          npm run check:features
          npm run check:certificates
          npm run build
          node scripts/check-internal-links.mjs
      - name: Validate Worker configuration offline
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.toml
      - name: Deploy to Cloudflare Worker (only when token exists)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Preview deployment not enabled::Add CLOUDFLARE_PREVIEW_API_TOKEN as a GitHub repository secret, then rerun this workflow."
            echo "The protected Cloudflare Worker still serves its setup placeholder."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.preview.toml
